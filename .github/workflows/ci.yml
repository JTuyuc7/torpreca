name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/shared/**'

  backend-and-shared:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run lint
      - run: cd apps/backend && bun test
      - run: cd packages/shared && bun test
      - run: cd apps/backend && bunx tsc --noEmit

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm --dir apps/dashboard install --frozen-lockfile
      - run: pnpm --dir apps/dashboard lint
      - run: pnpm --dir apps/dashboard test
      - run: pnpm --dir apps/dashboard build