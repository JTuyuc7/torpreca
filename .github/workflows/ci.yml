name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/shared/**'

  backend-and-shared:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run lint
      # apps/backend/.env is gitignored (real secrets) and never exists in
      # CI. users.repository.ts and stops.repository.ts import
      # core/config/env.ts directly (SECRET_KEY for the pgcrypto RPCs), and
      # env.ts fails fast (EnvSchema.parse) if any var is missing — these
      # placeholders only need to satisfy the schema shape, the tests mock
      # supabaseAdmin and never make a real request.
      - run: cd apps/backend && bun test
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SECRET_KEY: ci-placeholder-secret-key
          REQUEST_SIGNING_SECRET: ci-placeholder-signing-secret
          SIGNUP_CODE: ci-placeholder-signup-code
          ALLOWED_ORIGINS: http://localhost:3000
      - run: cd packages/shared && bun test
      - run: cd apps/backend && bunx tsc --noEmit

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          # jsdom@30 requires Node ^22.22.2 || ^24.15.0 || >=26 (its bundled
          # undici@8's CacheStorage needs a webidl helper Node 20 lacks —
          # "webidl.util.markAsUncloneable is not a function"). Node 20 was
          # never actually exercised by CI before this PR: the "dashboard"
          # job only runs when apps/dashboard files change, and none of the
          # PRs since ci.yml was added had touched any until this one.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dashboard lint
      - run: pnpm --filter dashboard test
      # Next.js evaluates API route modules at build time to collect their
      # config — app/api/auth/session/route.ts imports lib/backend/signed-fetch.ts,
      # which throws if NEXT_PUBLIC_BACKEND_URL/REQUEST_SIGNING_SECRET are
      # unset (see docs/deploy/environment-variables.md). CI doesn't deploy
      # anything, so these are placeholder values only, just enough for the
      # build to complete — the real ones live in Render, per environment.
      - run: pnpm --filter dashboard build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_BACKEND_URL: https://placeholder-backend.invalid
          REQUEST_SIGNING_SECRET: ci-placeholder-signing-secret